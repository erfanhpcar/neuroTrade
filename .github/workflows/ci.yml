# Canonical CI for neuroTrade.
# Runs the same Makefile targets local agents use.
# TRADING_MODE stays PAPER. No live keys. No private exchange calls.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON: python
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TRADING_MODE: PAPER

jobs:
  backend:
    name: backend-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          make backend-install
      - name: Backend lint, typecheck, tests
        run: make backend-check

  frontend:
    name: frontend-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Frontend lint, typecheck, tests, build
        run: make frontend-check
